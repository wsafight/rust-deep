<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" role="img" aria-labelledby="title desc">
  <title id="title">条件使用结束后再修改容器</title>
  <desc id="desc">引用产生后，一条路径读取引用，另一条不读，两条路径汇合后 push 都合法。</desc>
  <style>@media(prefers-color-scheme:dark){[fill="#f1f5f9"]{fill:#17252f}[fill="#0f172a"]{fill:#dce8ef}[fill="#dbeafe"]{fill:#203d56}[fill="#dcfce7"]{fill:#173e35}[fill="#e2e8f0"]{fill:#283945}[fill="#334155"]{fill:#a8bac8}[stroke="#334155"]{stroke:#a8bac8}[stroke="#2563eb"]{stroke:#73b3ef}[stroke="#15803d"]{stroke:#70c5a1}[stroke="#64748b"]{stroke:#8ca2b5}}</style>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#334155"/></marker></defs>
  <rect width="820" height="250" rx="12" fill="#f1f5f9"/>
  <g font-family="sans-serif" font-size="17" fill="#0f172a" text-anchor="middle">
    <rect x="25" y="80" width="190" height="65" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="120" y="118">first = &amp;values[0]</text>
    <rect x="300" y="30" width="200" height="60" rx="8" fill="#dbeafe" stroke="#2563eb"/><text x="400" y="66">读取 first</text>
    <rect x="300" y="140" width="200" height="60" rx="8" fill="#e2e8f0" stroke="#64748b"/><text x="400" y="176">不读取 first</text>
    <rect x="595" y="80" width="195" height="65" rx="8" fill="#dcfce7" stroke="#15803d"/><text x="692" y="118">values.push(...)</text>
    <text x="410" y="232" font-size="15">两条路径在修改前汇合；之后不再使用旧引用</text>
  </g>
  <g fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"><path d="M215 110L265 110L265 60L295 60"/><path d="M215 115L265 115L265 170L295 170"/><path d="M500 60L550 60L550 110L590 110"/><path d="M500 170L550 170L550 115L590 115"/></g>
</svg>
