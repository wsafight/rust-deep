minimum_pre_commit_version: "3.0.0"
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: rustfmt
        name: rustfmt
        entry: cargo fmt --all -- --check
        language: system
        pass_filenames: false
        files: \.rs$

      - id: clippy
        name: clippy (warnings as errors)
        entry: cargo clippy --workspace --all-targets --locked -- -D warnings
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|examples/.*\.rs)$

      - id: cargo-test
        name: cargo test (workspace)
        entry: cargo test --workspace --all-targets --locked
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|examples/.*\.rs)$

      - id: mdbook-test
        name: mdBook doctests
        entry: mdbook test
        language: system
        pass_filenames: false
        files: ^(book\.toml|src/.*\.md|examples/.*\.rs)$

      - id: verify-evidence
        name: verify evidence chain
        entry: scripts/verify-evidence.sh
        language: system
        pass_filenames: false
        files: ^(Cargo\.toml|Cargo\.lock|examples/|scripts/|tools/|rust-toolchain\.toml$)

      - id: ffi-test
        name: native C ABI probe
        entry: bash examples/ch29-layout-validity/c-ffi/run.sh
        language: system
        pass_filenames: false
        files: ^examples/ch29-layout-validity/(src/ffi\.rs|c-ffi/)
