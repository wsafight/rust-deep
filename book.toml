[book]
title = "Rust 深水区"
description = "Rust 1.98 里那些真正卡人的地方：所有权、Trait、并发、异步与 unsafe"
authors = ["jump-and-jump"]
language = "zh-CN"
src = "src"

[build]
build-dir = "book"
create-missing = true

[output.html]
default-theme = "navy"
preferred-dark-theme = "ayu"
no-section-label = false
git-repository-url = ""
edit-url-template = ""
mathjax-support = false

[output.html.code]
hidelines = { rust = "hidden" }

[output.html.search]
enable = true
limit-results = 30
teaser-word-count = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3
